[package]
name = "hx-highlight"
version = "0.1.0"
edition = "2021"
description = "Make TODO, NOTE, BEAD and DONE markers impossible to miss in Helix and Vim, from one JSON file"
license = "MIT"
repository = "https://github.com/davidawad/hx-highlight"
readme = "README.md"
keywords = ["helix", "vim", "highlight", "todo"]

[workspace]

[dependencies]
regex = "=1.11.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
